<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Board | Roblox Developers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Roblox-inspired Font and Colors */
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #1b1d1e; /* Specific Roblox Dark Theme Color */
            color: #ffffff;
        }

        .forum-container {
            background-color: #232527;
            border: 1px solid #393b3d;
        }

        .post-input {
            background-color: #000000;
            border: 1px solid #393b3d;
            color: #ffffff;
        }

        .post-input:focus {
            border-color: #00a2ff; /* Roblox Blue highlight */
            outline: none;
        }

        .btn-post {
            background-color: #00a2ff;
            transition: background 0.2s;
        }

        .btn-post:hover {
            background-color: #0081cc;
        }

        .sidebar-box {
            background-color: #232527;
            border: 1px solid #393b3d;
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-[#232527] border-b border-[#393b3d] px-6 py-3 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-[#393b3d] rounded-md flex items-center justify-center">
                    <i data-lucide="layout-grid" class="text-white w-6 h-6"></i>
                </div>
                <span class="font-black text-xl tracking-tight uppercase">Dev<span class="text-[#00a2ff]">Forum</span></span>
            </div>
            <div class="flex gap-4">
                <i data-lucide="search" class="text-gray-400 w-5 h-5 cursor-pointer"></i>
                <i data-lucide="bell" class="text-gray-400 w-5 h-5 cursor-pointer"></i>
                <div class="w-8 h-8 bg-gray-600 rounded-full"></div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6 p-6">
        
        <div class="hidden lg:block space-y-4">
            <div class="sidebar-box p-4 rounded-lg">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-3">Community Stats</h3>
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400">Total Threads</span>
                        <span id="threadCount" class="font-bold">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400">Users Online</span>
                        <span class="text-green-500 font-bold">142</span>
                    </div>
                </div>
            </div>
            <div class="sidebar-box p-4 rounded-lg">
                <p class="text-xs text-gray-500 leading-relaxed">
                    This is a private community board for Roblox developers. Please follow the rules.
                </p>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-6">
            
            <div class="forum-container p-6 rounded-lg shadow-lg">
                <div class="flex gap-4">
                    <div class="w-12 h-12 bg-gray-700 rounded-md shrink-0"></div>
                    <div class="flex-grow space-y-3">
                        <input type="text" id="user" placeholder="Display Name..." 
                               class="post-input w-full p-2 rounded text-sm font-bold">
                        <textarea id="msg" placeholder="What are you working on?" 
                                  class="post-input w-full p-3 rounded text-sm min-h-[80px]"></textarea>
                        <div class="flex justify-between items-center">
                            <div class="flex gap-2">
                                <i data-lucide="image" class="text-gray-500 w-5 h-5 cursor-pointer"></i>
                                <i data-lucide="code" class="text-gray-500 w-5 h-5 cursor-pointer"></i>
                            </div>
                            <button onclick="createPost()" class="btn-post px-6 py-2 rounded font-bold text-sm">
                                Create Topic
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="forumFeed" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Load Posts
        function updateFeed() {
            const feed = document.getElementById('forumFeed');
            const threads = JSON.parse(localStorage.getItem('rbx_threads') || '[]');
            document.getElementById('threadCount').innerText = threads.length;

            if(threads.length === 0) {
                feed.innerHTML = `<div class="text-center py-10 text-gray-600">No active discussions.</div>`;
                return;
            }

            feed.innerHTML = threads.map((t, i) => `
                <div class="forum-container p-5 rounded-lg flex justify-between items-center group hover:bg-[#2a2c2e] transition-colors cursor-pointer">
                    <div class="flex gap-4">
                        <div class="w-10 h-10 bg-[#00a2ff] rounded-md flex items-center justify-center font-bold">
                            ${t.user.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h4 class="font-bold text-[#00a2ff] hover:underline">${t.user}</h4>
                            <p class="text-gray-300 text-sm mt-1">${t.content}</p>
                            <span class="text-[10px] text-gray-500 mt-2 block">${t.time}</span>
                        </div>
                    </div>
                    <button onclick="removePost(${i})" class="opacity-0 group-hover:opacity-100 text-gray-600 hover:text-red-500">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function createPost() {
            const user = document.getElementById('user').value || "Guest Developer";
            const content = document.getElementById('msg').value;

            if(!content) return;

            const threads = JSON.parse(localStorage.getItem('rbx_threads') || '[]');
            threads.unshift({
                user: user,
                content: content,
                time: new Date().toLocaleString()
            });

            localStorage.setItem('rbx_threads', JSON.stringify(threads));
            document.getElementById('msg').value = '';
            updateFeed();
        }

        function removePost(index) {
            const threads = JSON.parse(localStorage.getItem('rbx_threads') || '[]');
            threads.splice(index, 1);
            localStorage.setItem('rbx_threads', JSON.stringify(threads));
            updateFeed();
        }

        // Start
        window.onload = updateFeed;
    </script>
</body>
</html>
