<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlox | Community Forum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0b;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .rbx-red { color: #f64141; }
        .bg-rbx-red { background-color: #f64141; }

        .hero-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 32px 32px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post-animation { animation: slideIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="hero-pattern min-h-screen">

    <nav class="fixed w-full z-50 glass border-b border-white/5 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 font-bold text-xl tracking-tighter">
                <div class="w-8 h-8 bg-rbx-red rounded-lg flex items-center justify-center">
                    <i data-lucide="message-square" class="w-5 h-5 text-white"></i>
                </div>
                DEV<span class="rbx-red">FORUM</span>
            </div>
            <div class="flex items-center gap-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                System Ready
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-32 px-6 pb-20">
        
        <div class="glass p-8 rounded-[2.5rem] mb-12 border border-white/10 shadow-2xl">
            <h2 class="text-sm font-bold uppercase tracking-[0.2em] text-gray-500 mb-6 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> New Discussion
            </h2>
            <div class="space-y-4">
                <input type="text" id="usernameInput" placeholder="Your Roblox Username..." 
                    class="w-full bg-black/40 border border-white/10 rounded-xl p-4 focus:outline-none focus:border-red-500 transition-all placeholder:text-gray-600">
                
                <textarea id="postInput" placeholder="What's happening in Studio?" rows="3"
                    class="w-full bg-black/40 border border-white/10 rounded-xl p-4 focus:outline-none focus:border-red-500 transition-all resize-none placeholder:text-gray-600"></textarea>
                
                <button onclick="addPost()" class="w-full bg-rbx-red hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-all active:scale-[0.98] shadow-lg shadow-red-600/20 flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> POST THREAD
                </button>
            </div>
        </div>

        <div class="flex items-center justify-between mb-8">
            <h3 class="text-xs font-black uppercase tracking-[0.3em] text-gray-500">Recent Activity</h3>
            <button onclick="clearAll()" class="text-[10px] font-bold text-gray-700 hover:text-red-500 transition-colors uppercase tracking-widest">Clear My Feed</button>
        </div>

        <div id="forumFeed" class="space-y-6">
            </div>
    </main>

    <script>
        lucide.createIcons();

        window.onload = function() {
            renderPosts();
        };

        function addPost() {
            const user = document.getElementById('usernameInput').value.trim();
            const text = document.getElementById('postInput').value.trim();

            if (!user || !text) {
                alert("Please enter both a username and a message!");
                return;
            }

            const posts = JSON.parse(localStorage.getItem('forum_posts') || '[]');
            const newPost = {
                id: Date.now(),
                username: user,
                content: text,
                timestamp: new Date().toLocaleString()
            };

            posts.unshift(newPost);
            localStorage.setItem('forum_posts', JSON.stringify(posts));
            document.getElementById('postInput').value = '';
            renderPosts();
        }

        function renderPosts() {
            const feed = document.getElementById('forumFeed');
            const posts = JSON.parse(localStorage.getItem('forum_posts') || '[]');

            if (posts.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-20 glass rounded-[2rem] border-dashed border-white/10">
                        <i data-lucide="inbox" class="w-12 h-12 text-gray-800 mx-auto mb-4"></i>
                        <p class="text-gray-600 font-medium tracking-wide">The forum is empty. Start the first thread!</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            feed.innerHTML = posts.map(post => `
                <div class="glass p-6 rounded-3xl border border-white/5 hover:border-red-500/30 transition-all post-animation">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-gradient-to-br from-red-600 to-orange-600 rounded-xl flex items-center justify-center font-bold text-sm shadow-lg uppercase">
                                ${post.username.substring(0,1)}
                            </div>
                            <div>
                                <p class="font-bold text-red-500">@${post.username}</p>
                                <p class="text-[10px] text-gray-600 font-mono tracking-tighter">${post.timestamp}</p>
                            </div>
                        </div>
                        <button onclick="deletePost(${post.id})" class="text-gray-800 hover:text-red-500 transition-colors">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p class="text-gray-300 leading-relaxed whitespace-pre-wrap">${post.content}</p>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        function deletePost(id) {
            let posts = JSON.parse(localStorage.getItem('forum_posts') || '[]');
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('forum_posts', JSON.stringify(posts));
            renderPosts();
        }

        function clearAll() {
            if(confirm("Clear your local feed?")) {
                localStorage.removeItem('forum_posts');
                renderPosts();
            }
        }
    </script>
</body>
</html>
